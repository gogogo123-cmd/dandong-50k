<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>if(/MicroMessenger/i.test(navigator.userAgent))document.documentElement.className+=' wechat';if((window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone)document.documentElement.className+=' pwa';</script>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="2301桌游">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#082720">
<title>2301桌游</title>
<link rel="stylesheet" href="shared.css?v=2">
<style>
/* ===== 2301 桌游启动页：横屏优先 ===== */
html,body{min-height:100%}
body{background:radial-gradient(ellipse at 50% -10%,#155544 0%,#0a2b24 46%,#061a16 100%)}
.home-shell{min-height:100dvh;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(8px,2vh,20px);padding:calc(env(safe-area-inset-top,0px) + clamp(10px,1.8vh,20px)) calc(env(safe-area-inset-right,0px) + clamp(12px,2vw,22px)) calc(env(safe-area-inset-bottom,0px) + clamp(10px,1.8vh,18px)) calc(env(safe-area-inset-left,0px) + clamp(12px,2vw,22px))}
.home-top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.home-brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.home-brand b{color:#fff3d9;font-size:clamp(20px,3.4vh,30px);letter-spacing:.14em;font-weight:900}
.home-brand span{color:#8fae9f;font-size:10px;letter-spacing:.32em}
.home-tip{color:#8fae9f;font-size:11px;letter-spacing:.16em;white-space:nowrap}
.home-games{flex:1 1 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,2.2vw,26px);min-height:0}
.game-tile{position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.7vh,18px);padding:clamp(14px,3vh,36px) clamp(14px,2.4vw,32px);border-radius:clamp(16px,2.6vh,26px);border:1px solid #ffffff22;background:linear-gradient(165deg,#0f4235e8 0%,#07251ee8 62%,#041712f2 100%);box-shadow:0 20px 54px #00120ddd,inset 0 1px 0 #ffffff12;text-align:center;min-height:0;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.game-tile:hover{transform:translateY(-2px);border-color:#ffffff3a;box-shadow:0 26px 64px #00120dee,inset 0 1px 0 #ffffff1c}
.game-tile::before{content:"";position:absolute;inset:-30% -20% auto;height:70%;background:radial-gradient(ellipse at center,#e9c47a1f,transparent 70%);pointer-events:none;z-index:-1}
.game-tile.fiftyk::after{content:"♠";position:absolute;right:2%;bottom:-14%;font-size:clamp(120px,26vh,240px);line-height:1;color:#d34a430f;pointer-events:none;z-index:-1}
.game-tile.baohuang::before{background:radial-gradient(ellipse at center,#6eaed726,transparent 70%)}
.game-tile.baohuang::after{content:"皇";position:absolute;right:2%;bottom:-14%;font-size:clamp(120px,26vh,240px);line-height:1;color:#6eaed70f;pointer-events:none;z-index:-1}
.tile-emblem{width:clamp(46px,9.6vh,84px);height:clamp(46px,9.6vh,84px);border-radius:clamp(13px,2.4vh,24px);display:grid;place-items:center;font-weight:900;font-size:clamp(15px,3.2vh,28px);letter-spacing:.02em;color:#2a2110;background:linear-gradient(145deg,#f4ddA1,#cfa955);box-shadow:0 10px 24px #00000055,inset 0 1px 0 #fff8df}
.game-tile.baohuang .tile-emblem{background:linear-gradient(145deg,#c9e6f8,#74add4);color:#0f2836;box-shadow:0 10px 24px #00000055,inset 0 1px 0 #eaf8ff}
.game-tile h2{margin:0;font-size:clamp(22px,4.2vh,40px);letter-spacing:.18em;color:#fff4dd;text-indent:.18em}
.tile-actions{display:flex;flex-direction:column;gap:clamp(6px,1.2vh,10px);width:min(100%,300px)}
.tile-actions .btn{width:100%;padding:clamp(7px,1.5vh,13px) 14px;font-size:clamp(12px,1.7vh,15px);border-radius:12px}
.tile-actions .btn.ghost{background:#ffffff0a;border-color:#ffffff2e;color:#d8e7df}
.tile-actions .btn.ghost:hover{background:#ffffff14}
.continue-row{position:absolute;left:50%;bottom:clamp(10px,2vh,20px);transform:translateX(-50%);width:min(84%,300px)}
.continue-btn{width:100%;text-align:center;font:600 clamp(10px,1.4vh,12px) inherit;cursor:pointer;border:1px dashed #e9c47a66;border-radius:10px;background:#e9c47a10;color:#f0dcab;padding:clamp(5px,1vh,8px) 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.continue-btn:hover{background:#e9c47a1f}
.home-modal{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:#041410cc;backdrop-filter:blur(3px);padding:18px}
.home-modal.show{display:grid}
.home-box{width:min(92vw,420px);border:1px solid #ffffff26;border-radius:18px;background:linear-gradient(160deg,#0e3b30,#08211b);padding:22px;box-shadow:0 24px 70px #000}
.home-box h2{margin:0 0 6px;color:#fff4dd;font-size:22px}
.home-box p{margin:0 0 14px;color:#a9c4b7;font-size:13px}
.home-box input{width:100%;margin:6px 0;padding:11px 12px;border-radius:10px;border:1px solid #ffffff2b;background:#ffffff0d;color:#f5efdf;font:15px inherit;outline:none}
.home-box input:focus{border-color:var(--gold)}
.home-box .join-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}
@media (max-width:820px) and (orientation:portrait){
  .home-shell{max-width:520px}
  .home-games{grid-template-columns:1fr;grid-auto-rows:minmax(0,1fr)}
  .game-tile{padding:clamp(16px,3vh,26px) 18px}
  .home-tip{display:none}
}
@media (max-height:430px) and (orientation:landscape){
  .home-shell{gap:6px}
  .home-brand b{font-size:19px}
  .game-tile{gap:6px;padding:10px 16px;border-radius:14px}
  .tile-emblem{width:40px;height:40px;font-size:13px;border-radius:11px}
  .game-tile h2{font-size:19px}
  .tile-actions{gap:5px}
  .tile-actions .btn{padding:5px 10px;font-size:11px;border-radius:9px}
  .continue-btn{padding:4px 8px;font-size:10px}
  .home-tip{font-size:10px}
}
</style>
</head>
<body>
<div class="home-shell">
  <header class="home-top">
    <div class="home-brand"><b>2301桌游</b><span>TABLE GAMES</span></div>
    <span class="home-tip">横屏体验更佳</span>
  </header>
  <main class="home-games">
    <article class="game-tile fiftyk">
      <div class="tile-emblem">50K</div>
      <h2>五十K</h2>
      <div class="tile-actions">
        <button class="btn primary" data-act="demo" data-game="50k" type="button">机器人陪玩</button>
        <button class="btn" data-act="create" data-game="50k" type="button">创建牌桌</button>
        <button class="btn ghost" data-act="join" data-game="50k" type="button">加入房间</button>
      </div>
      <div class="continue-row" data-continue="50k"></div>
    </article>
    <article class="game-tile baohuang">
      <div class="tile-emblem">皇</div>
      <h2>保皇</h2>
      <div class="tile-actions">
        <button class="btn primary" data-act="demo" data-game="baohuang" type="button">机器人陪玩</button>
        <button class="btn" data-act="create" data-game="baohuang" type="button">创建牌桌</button>
        <button class="btn ghost" data-act="join" data-game="baohuang" type="button">加入房间</button>
      </div>
      <div class="continue-row" data-continue="baohuang"></div>
    </article>
  </main>
</div>

<div class="home-modal" id="homeModal">
  <form class="home-box" id="homeForm">
    <h2 id="homeModalTitle">创建牌桌</h2>
    <p id="homeModalDesc"></p>
    <input id="homeRoomCode" maxlength="6" autocomplete="off" spellcheck="false" placeholder="6 位房间码" style="display:none">
    <input id="homeNickname" maxlength="12" autocomplete="nickname" placeholder="你的昵称" required>
    <div class="join-actions">
      <button type="button" class="btn" id="homeCancel">取消</button>
      <button type="submit" class="btn primary" id="homeSubmit">进入</button>
    </div>
  </form>
</div>
<div id="toast" style="position:fixed;z-index:100;left:8px;top:calc(env(safe-area-inset-top,0px) + 4px);background:#f4e8c9;color:#26342b;padding:4px 12px;border-radius:8px;font-size:11px;max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:.2s;pointer-events:none"></div>

<script>if(/github\.io$/.test(location.hostname))window.DANDONG_API_BASE='https://carefree-trust-production-86944664.up.railway.app';window.DANDONG_ASSET_PREFIX='assets/';</script>
<script src="shared.js?v=3"></script>
<script>if('serviceWorker' in navigator){addEventListener('load',function(){try{navigator.serviceWorker.register('sw.js?v=20').catch(function(){})}catch(e){}})}</script>
<script>
'use strict';
(function () {
  const GAMES = {
    '50k': { name: '五十K', seats: 6, path: '50k/', session: 'dandong50k-session' },
    baohuang: { name: '保皇', seats: 5, path: 'baohuang/', session: 'baohuang-session' },
  };
  let mode = null;
  let gameKey = null;

  function openModal(game, act) {
    gameKey = game;
    mode = act;
    const g = GAMES[game];
    const isJoin = act === 'join';
    document.querySelector('#homeModalTitle').textContent = act === 'demo'
      ? `${g.name} · 机器人陪玩` : isJoin ? `加入${g.name}牌桌` : `创建${g.name}牌桌`;
    document.querySelector('#homeModalDesc').textContent = isJoin
      ? '输入房主发给你的 6 位房间码，再填昵称。'
      : act === 'demo' ? `输入昵称，${g.seats - 1} 个机器人会自动入座并开局。` : '输入昵称后创建牌桌。';
    const code = document.querySelector('#homeRoomCode');
    code.style.display = isJoin ? 'block' : 'none';
    if (isJoin && !code.value) code.value = '';
    document.querySelector('#homeModal').classList.add('show');
    setTimeout(() => {
      if (isJoin && !code.value) code.focus();
      else document.querySelector('#homeNickname').focus();
    }, 60);
  }

  function closeModal() {
    document.querySelector('#homeModal').classList.remove('show');
  }

  async function enter() {
    const g = GAMES[gameKey];
    const name = document.querySelector('#homeNickname').value.trim() || '玩家';
    const body = { name, game: gameKey };
    if (mode === 'join') {
      const code = (document.querySelector('#homeRoomCode').value || '').trim().toUpperCase().replace(/[^0-9A-F]/g, '');
      if (code.length !== 6) {
        DD.notice('请输入 6 位房间码');
        document.querySelector('#homeRoomCode').focus();
        return;
      }
      body.room = code;
    }
    const submit = document.querySelector('#homeSubmit');
    submit.disabled = true;
    try {
      let r;
      if (mode === 'join') {
        r = await DD.api('join', body);
      } else {
        r = await DD.api('create', body);
        if (mode === 'demo') {
          for (let i = 1; i < g.seats; i++) {
            try { await DD.api('addbot', { room: r.room, token: r.token, seat: i }); } catch (e) { DD.notice(e.message); break; }
          }
          try { await DD.api('start', { room: r.room, token: r.token }); } catch (e) { DD.notice(e.message); }
        }
      }
      DD.session(g.session).save({ room: r.room, seat: r.seat, token: r.token });
      closeModal();
      location.href = g.path;
    } catch (e) {
      DD.notice(e.message);
      submit.disabled = false;
    }
  }

  function renderContinue() {
    for (const key of Object.keys(GAMES)) {
      const g = GAMES[key];
      const saved = DD.session(g.session).load();
      const row = document.querySelector(`[data-continue="${key}"]`);
      if (!row) continue;
      if (!saved) { row.innerHTML = ''; continue; }
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'continue-btn';
      b.textContent = `继续上次牌桌 · 房间码 ${saved.room}`;
      b.onclick = () => { location.href = g.path; };
      row.innerHTML = '';
      row.appendChild(b);
    }
  }

  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (btn) openModal(btn.dataset.game, btn.dataset.act);
  });
  document.querySelector('#homeCancel').onclick = closeModal;
  document.querySelector('#homeModal').addEventListener('click', (e) => {
    if (e.target.id === 'homeModal') closeModal();
  });
  document.querySelector('#homeRoomCode').addEventListener('input', (e) => {
    e.target.value = e.target.value.toUpperCase().replace(/[^0-9A-F]/g, '').slice(0, 6);
  });
  document.querySelector('#homeForm').onsubmit = (e) => {
    e.preventDefault();
    enter();
  };

  // 旧邀请链接 /#room=CODE → 五十K 页面
  function legacyRoom() {
    const m = location.hash.match(/^#room=([0-9A-Fa-f]{6})$/);
    if (m) location.replace('50k/' + location.hash);
    return !!m;
  }
  window.addEventListener('hashchange', legacyRoom);

  DD.preloadCardFaces();
  renderContinue();
  legacyRoom();
})();
</script>
</body>
</html>
