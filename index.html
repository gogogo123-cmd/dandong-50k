<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>if(/MicroMessenger/i.test(navigator.userAgent))document.documentElement.className+=' wechat';if((window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone)document.documentElement.className+=' pwa';</script>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="2301桌游">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#082720">
<title>2301桌游</title>
<link rel="stylesheet" href="shared.css">
<style>
.home-wrap{max-width:1040px;margin:auto;padding:22px 16px 40px}
.home-hero{text-align:center;padding:7vh 8px 18px}
.home-hero h1{font-size:clamp(40px,7vw,64px);margin:0 0 10px;letter-spacing:.16em;color:#fff5df}
.home-hero p{color:var(--muted);margin:0;letter-spacing:.08em}
.game-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:26px}
@media(max-width:720px){.game-grid{grid-template-columns:1fr}}
.game-card{position:relative;border:1px solid #ffffff24;border-radius:20px;padding:22px 20px;background:linear-gradient(160deg,#0d3b30dd,#071f1add);box-shadow:0 16px 40px #00150f88;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.game-card:before{content:"";position:absolute;inset:-40% -20% auto;height:220px;background:radial-gradient(ellipse at center,#e9c47a22,transparent 70%);pointer-events:none}
.game-card.fiftyk:after{content:"";position:absolute;right:-30px;bottom:-40px;width:170px;height:170px;background:radial-gradient(circle,#d34a4333,transparent 68%);pointer-events:none}
.game-card.baohuang:after{content:"";position:absolute;right:-30px;bottom:-40px;width:170px;height:170px;background:radial-gradient(circle,#6eaed733,transparent 68%);pointer-events:none}
.game-emblem{width:66px;height:66px;border-radius:18px;display:flex;align-items:center;justify-content:center;font:800 22px/1 system-ui;letter-spacing:.04em;color:#2a2110;background:linear-gradient(145deg,#f2d795,#cfa955);box-shadow:0 8px 20px #00000055}
.game-card.baohuang .game-emblem{background:linear-gradient(145deg,#bfe0f5,#7fb3d5);color:#132c3a}
.game-card h2{margin:2px 0 0;font-size:28px;letter-spacing:.12em;color:#fff4dd}
.game-card p{margin:0;color:#b9d0c5;font-size:14px;line-height:1.6}
.game-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.game-meta span{font-size:12px;color:#d9e8df;border:1px solid #ffffff22;border-radius:999px;padding:3px 10px;background:#ffffff0a}
.game-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;position:relative;z-index:1}
.game-actions .btn{padding:10px 16px}
.continue-row{margin-top:12px;position:relative;z-index:1}
.continue-btn{width:100%;text-align:left;font:600 13px inherit;cursor:pointer;border:1px dashed #e9c47a66;border-radius:12px;background:#e9c47a10;color:#f0dcab;padding:10px 12px}
.continue-btn:hover{background:#e9c47a1f}
.home-foot{margin-top:28px;text-align:center;color:#8da99c;font-size:12px;line-height:1.8}
.home-modal{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:#041410cc;backdrop-filter:blur(3px);padding:18px}
.home-modal.show{display:grid}
.home-box{width:min(92vw,420px);border:1px solid #ffffff26;border-radius:18px;background:linear-gradient(160deg,#0e3b30,#08211b);padding:22px;box-shadow:0 24px 70px #000}
.home-box h2{margin:0 0 6px;color:#fff4dd;font-size:22px}
.home-box p{margin:0 0 14px;color:#a9c4b7;font-size:13px}
.home-box input{width:100%;margin:6px 0;padding:11px 12px;border-radius:10px;border:1px solid #ffffff2b;background:#ffffff0d;color:#f5efdf;font:15px inherit;outline:none}
.home-box input:focus{border-color:var(--gold)}
.home-box .join-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}
@media(max-width:950px) and (orientation:landscape){.home-wrap{padding:10px 12px 16px}.home-hero{padding:1vh 8px 4px}.home-hero h1{font-size:clamp(26px,4.6vw,38px);margin-bottom:2px}.home-hero p{font-size:11px}.game-grid{margin-top:8px;gap:10px}.game-card{padding:10px 12px;gap:6px;border-radius:14px}.game-emblem{width:40px;height:40px;font-size:14px;border-radius:10px}.game-card h2{font-size:19px}.game-card p{font-size:11px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.game-meta span{font-size:10px;padding:2px 8px}.game-actions{margin-top:6px;gap:6px}.game-actions .btn{padding:6px 10px;font-size:11px}.home-foot{display:none}}
</style>
</head>
<body>
<div class="home-wrap">
  <header class="top"><span>2301 · TABLE GAMES</span><span>横屏牌桌 · 邀请好友</span></header>
  <section class="home-hero">
    <h1>2301桌游</h1>
    <p>选一个牌桌，创建房间或输入房间码加入</p>
  </section>
  <main class="game-grid">
    <article class="game-card fiftyk">
      <div class="game-emblem">50K</div>
      <h2>五十K</h2>
      <p>六人三副牌，红蓝组队争分。纯腿、杂腿、炸弹与接风，三小局一轮换。</p>
      <div class="game-meta"><span>6 人</span><span>三副牌</span><span>组队</span></div>
      <div class="game-actions">
        <button class="btn primary" data-act="demo" data-game="50k" type="button">机器人陪玩</button>
        <button class="btn" data-act="create" data-game="50k" type="button">创建牌桌</button>
        <button class="btn" data-act="join" data-game="50k" type="button">加入房间</button>
      </div>
      <div class="continue-row" data-continue="50k"></div>
    </article>
    <article class="game-card baohuang">
      <div class="game-emblem">皇</div>
      <h2>保皇</h2>
      <p>五人四副牌，暗侍卫与皇帝阵营对抗革命党。买6、皇炸、混儿与给风。</p>
      <div class="game-meta"><span>5 人</span><span>157 张</span><span>身份</span></div>
      <div class="game-actions">
        <button class="btn primary" data-act="demo" data-game="baohuang" type="button">机器人陪玩</button>
        <button class="btn" data-act="create" data-game="baohuang" type="button">创建牌桌</button>
        <button class="btn" data-act="join" data-game="baohuang" type="button">加入房间</button>
      </div>
      <div class="continue-row" data-continue="baohuang"></div>
    </article>
  </main>
  <div class="home-foot">牌桌为横屏模式，请将手机横过来；加入时请使用房主分享的 6 位房间码。</div>
</div>

<div class="home-modal" id="homeModal">
  <form class="home-box" id="homeForm">
    <h2 id="homeModalTitle">创建牌桌</h2>
    <p id="homeModalDesc"></p>
    <input id="homeRoomCode" maxlength="6" autocomplete="off" spellcheck="false" placeholder="6 位房间码" style="display:none">
    <input id="homeNickname" maxlength="12" autocomplete="nickname" placeholder="你的昵称" required>
    <div class="join-actions">
      <button type="button" class="btn" id="homeCancel">取消</button>
      <button type="submit" class="btn primary" id="homeSubmit">进入</button>
    </div>
  </form>
</div>
<div id="toast" style="position:fixed;z-index:100;left:8px;top:calc(env(safe-area-inset-top,0px) + 4px);background:#f4e8c9;color:#26342b;padding:4px 12px;border-radius:8px;font-size:11px;max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:.2s;pointer-events:none"></div>

<script>if(/github\.io$/.test(location.hostname))window.DANDONG_API_BASE='https://carefree-trust-production-86944664.up.railway.app';window.DANDONG_ASSET_PREFIX='assets/';</script>
<script src="shared.js"></script>
<script>if('serviceWorker' in navigator){addEventListener('load',function(){try{navigator.serviceWorker.register('sw.js?v=20').catch(function(){})}catch(e){}})}</script>
<script>
'use strict';
(function () {
  const GAMES = {
    '50k': { name: '五十K', seats: 6, path: '50k/', session: 'dandong50k-session' },
    baohuang: { name: '保皇', seats: 5, path: 'baohuang/', session: 'baohuang-session' },
  };
  let mode = null;
  let gameKey = null;

  function openModal(game, act) {
    gameKey = game;
    mode = act;
    const g = GAMES[game];
    const isJoin = act === 'join';
    document.querySelector('#homeModalTitle').textContent = act === 'demo'
      ? `${g.name} · 机器人陪玩` : isJoin ? `加入${g.name}牌桌` : `创建${g.name}牌桌`;
    document.querySelector('#homeModalDesc').textContent = isJoin
      ? '输入房主发给你的 6 位房间码，再填昵称。'
      : act === 'demo' ? `输入昵称，${g.seats - 1} 个机器人会自动入座并开局。` : '输入昵称后创建牌桌。';
    const code = document.querySelector('#homeRoomCode');
    code.style.display = isJoin ? 'block' : 'none';
    if (isJoin && !code.value) code.value = '';
    document.querySelector('#homeModal').classList.add('show');
    setTimeout(() => {
      if (isJoin && !code.value) code.focus();
      else document.querySelector('#homeNickname').focus();
    }, 60);
  }

  function closeModal() {
    document.querySelector('#homeModal').classList.remove('show');
  }

  async function enter() {
    const g = GAMES[gameKey];
    const name = document.querySelector('#homeNickname').value.trim() || '玩家';
    const body = { name, game: gameKey };
    if (mode === 'join') {
      const code = (document.querySelector('#homeRoomCode').value || '').trim().toUpperCase().replace(/[^0-9A-F]/g, '');
      if (code.length !== 6) {
        DD.notice('请输入 6 位房间码');
        document.querySelector('#homeRoomCode').focus();
        return;
      }
      body.room = code;
    }
    const submit = document.querySelector('#homeSubmit');
    submit.disabled = true;
    try {
      let r;
      if (mode === 'join') {
        r = await DD.api('join', body);
      } else {
        r = await DD.api('create', body);
        if (mode === 'demo') {
          for (let i = 1; i < g.seats; i++) {
            try { await DD.api('addbot', { room: r.room, token: r.token, seat: i }); } catch (e) { DD.notice(e.message); break; }
          }
          try { await DD.api('start', { room: r.room, token: r.token }); } catch (e) { DD.notice(e.message); }
        }
      }
      DD.session(g.session).save({ room: r.room, seat: r.seat, token: r.token });
      closeModal();
      location.href = g.path;
    } catch (e) {
      DD.notice(e.message);
      submit.disabled = false;
    }
  }

  function renderContinue() {
    for (const key of Object.keys(GAMES)) {
      const g = GAMES[key];
      const saved = DD.session(g.session).load();
      const row = document.querySelector(`[data-continue="${key}"]`);
      if (!row) continue;
      if (!saved) { row.innerHTML = ''; continue; }
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'continue-btn';
      b.textContent = `继续上次牌桌 · 房间码 ${saved.room}`;
      b.onclick = () => { location.href = g.path; };
      row.innerHTML = '';
      row.appendChild(b);
    }
  }

  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (btn) openModal(btn.dataset.game, btn.dataset.act);
  });
  document.querySelector('#homeCancel').onclick = closeModal;
  document.querySelector('#homeModal').addEventListener('click', (e) => {
    if (e.target.id === 'homeModal') closeModal();
  });
  document.querySelector('#homeRoomCode').addEventListener('input', (e) => {
    e.target.value = e.target.value.toUpperCase().replace(/[^0-9A-F]/g, '').slice(0, 6);
  });
  document.querySelector('#homeForm').onsubmit = (e) => {
    e.preventDefault();
    enter();
  };

  // 旧邀请链接 /#room=CODE → 五十K 页面
  function legacyRoom() {
    const m = location.hash.match(/^#room=([0-9A-Fa-f]{6})$/);
    if (m) location.replace('50k/' + location.hash);
    return !!m;
  }
  window.addEventListener('hashchange', legacyRoom);

  DD.preloadCardFaces();
  renderContinue();
  legacyRoom();
})();
</script>
</body>
</html>
